<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Producción — Ficha técnica y órdenes</title>
  <style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --bg:            #15171C;
    --surface:       #1C1F26;
    --surface-raised:#232730;
    --line:          #2E323C;
    --line-stitch:   #3A3F4B;
    --text:          #E9E7E2;
    --text-muted:    #9497A1;
    --text-faint:    #5C6070;
    --brass:         #C9A227;
    --brass-soft:    #C9A22722;
    --good:          #5FA876;
    --good-soft:     #5FA87622;
    --bad:           #CB6552;
    --bad-soft:      #CB655222;

    --font-display: 'Space Grotesk', sans-serif;
    --font-body:    'Inter', sans-serif;
    --font-mono:    'IBM Plex Mono', monospace;

    --radius: 6px;
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    background:var(--bg); color:var(--text); font-family:var(--font-body);
    font-size:14px; -webkit-font-smoothing:antialiased;
  }
  button, input, select, textarea{ font-family:inherit; font-size:inherit; color:inherit; }
  ::selection{ background:var(--brass-soft); color:var(--text); }
  *:focus-visible{ outline:2px solid var(--brass); outline-offset:2px; }

  .app{ display:grid; grid-template-columns:210px 1fr; min-height:100vh; }

  .sidebar{
    background:var(--surface); border-right:1px dashed var(--line-stitch);
    display:flex; flex-direction:column; padding:20px 14px; overflow-y:auto;
  }
  .brand{ display:flex; align-items:center; gap:10px; padding:6px 8px 22px; }
  .brand__mark{ font-size:20px; color:var(--brass); }
  .brand__text{ display:flex; flex-direction:column; line-height:1.25; }
  .brand__title{ font-family:var(--font-display); font-weight:700; font-size:15px; }
  .brand__subtitle{ font-size:10.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.6px; }

  .nav{ display:flex; flex-direction:column; gap:2px; flex:1; }
  .nav__item{
    display:flex; align-items:center; gap:10px; background:transparent; border:none;
    text-align:left; padding:9px 10px; border-radius:var(--radius); color:var(--text-muted);
    cursor:pointer; transition:background .12s ease, color .12s ease; width:100%;
  }
  .nav__item:hover{ background:var(--surface-raised); color:var(--text); }
  .nav__item[data-current="true"]{ background:var(--brass-soft); color:var(--brass); }
  .nav__num{ font-family:var(--font-mono); font-size:11px; color:var(--text-faint); width:20px; flex-shrink:0; }
  .nav__item[data-current="true"] .nav__num{ color:var(--brass); }

  .sidebar__foot{ padding-top:14px; border-top:1px dashed var(--line-stitch); }
  .session{ display:flex; align-items:center; gap:9px; padding:6px; }
  .session__dot{ width:7px; height:7px; border-radius:50%; background:var(--text-faint); flex-shrink:0; }
  .session[data-ok="true"] .session__dot{ background:var(--good); }
  .session[data-ok="false"] .session__dot{ background:var(--bad); }
  .session__info{ display:flex; flex-direction:column; line-height:1.3; overflow:hidden; }
  .session__name{ font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .session__role{ font-family:var(--font-mono); font-size:10.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.4px; cursor:pointer; text-decoration:underline; }

  .main{ display:flex; flex-direction:column; min-width:0; }
  .topbar{
    display:flex; align-items:center; justify-content:space-between; padding:22px 32px;
    border-bottom:1px dashed var(--line-stitch); gap:16px; flex-wrap:wrap;
  }
  .topbar__title{ font-family:var(--font-display); font-size:20px; font-weight:600; margin:0; }
  .topbar__hint{ color:var(--text-faint); font-size:12px; margin-top:3px; }
  .topbar__actions{ display:flex; gap:8px; flex-wrap:wrap; }

  .view{ padding:28px 32px; overflow:auto; }

  .toast{
    position:fixed; top:20px; right:24px; z-index:60; padding:11px 16px; border-radius:var(--radius);
    font-size:13px; background:var(--surface-raised); border:1px solid var(--line); box-shadow:0 6px 20px #00000055;
    opacity:0; transform:translateY(-6px); pointer-events:none; transition:opacity .18s ease, transform .18s ease; max-width:360px;
  }
  .toast[data-show="true"]{ opacity:1; transform:translateY(0); }
  .toast[data-type="ok"]{ border-color:var(--good); }
  .toast[data-type="error"]{ border-color:var(--bad); }

  .card{ background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:20px; }
  .card + .card{ margin-top:16px; }
  .card__title{ font-family:var(--font-display); font-size:14px; font-weight:600; margin:0 0 4px; }
  .card__hint{ color:var(--text-muted); font-size:12.5px; margin:0 0 16px; }

  .grid-kpi{ display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; margin-bottom:22px; }
  .kpi{ background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:16px 18px; }
  .kpi__label{ font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:var(--text-faint); }
  .kpi__value{ font-family:var(--font-mono); font-size:24px; margin-top:6px; }

  table{ width:100%; border-collapse:collapse; }
  thead th{
    text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.4px; color:var(--text-faint);
    font-weight:600; padding:8px 10px; border-bottom:1px dashed var(--line-stitch); white-space:nowrap;
  }
  tbody td{ padding:10px 10px; border-bottom:1px solid var(--line); font-size:13px; vertical-align:middle; }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr[data-clickable="true"]{ cursor:pointer; }
  tbody tr[data-clickable="true"]:hover{ background:var(--surface-raised); }
  td.mono, .mono{ font-family:var(--font-mono); font-size:12.5px; }
  .table-wrap{ overflow-x:auto; }
  .row-actions{ display:flex; gap:6px; justify-content:flex-end; white-space:nowrap; }

  .badge{
    display:inline-flex; align-items:center; padding:3px 8px; border-radius:20px; font-size:11px;
    font-family:var(--font-mono); text-transform:uppercase; letter-spacing:.3px; border:1px solid var(--line); white-space:nowrap;
  }
  .badge[data-tone="ok"]{ color:var(--good); border-color:var(--good); }
  .badge[data-tone="off"]{ color:var(--text-faint); }
  .badge[data-tone="bad"]{ color:var(--bad); border-color:var(--bad); }
  .badge[data-tone="brass"]{ color:var(--brass); border-color:var(--brass); }

  .btn{
    display:inline-flex; align-items:center; gap:6px; background:var(--surface-raised); border:1px solid var(--line);
    color:var(--text); padding:8px 14px; border-radius:var(--radius); cursor:pointer; font-size:13px; font-weight:500;
    transition:border-color .12s ease, transform .06s ease;
  }
  .btn:hover{ border-color:var(--text-faint); }
  .btn:active{ transform:translateY(1px); }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .btn--primary{ background:var(--brass); border-color:var(--brass); color:#1B1704; font-weight:600; }
  .btn--primary:hover{ border-color:var(--brass); filter:brightness(1.06); }
  .btn--danger{ color:var(--bad); }
  .btn--danger:hover{ border-color:var(--bad); }
  .btn--ghost{ background:transparent; }
  .btn--sm{ padding:5px 10px; font-size:12px; }

  .field{ display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
  .field label{ font-size:11.5px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.3px; }
  .field__hint{ font-size:11px; color:var(--text-faint); margin-top:-2px; }
  .field input, .field select, .field textarea{
    background:var(--bg); border:1px solid var(--line); border-radius:var(--radius); padding:9px 11px; color:var(--text); width:100%;
  }
  .field input:focus, .field select:focus, .field textarea:focus{ border-color:var(--brass); }

  .form-row{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .form-row--3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; }
  .form-row--4{ display:grid; grid-template-columns:2fr 1fr 1fr 1fr; gap:10px; align-items:end; }

  .subform{ border:1px dashed var(--line-stitch); border-radius:8px; padding:12px; margin-bottom:10px; position:relative; }
  .subform__remove{ position:absolute; top:8px; right:8px; }

  .modal-backdrop{
    position:fixed; inset:0; background:#000000AA; display:none; align-items:flex-start; justify-content:center;
    z-index:40; overflow-y:auto; padding:40px 16px;
  }
  .modal-backdrop[data-open="true"]{ display:flex; }
  .modal{ width:460px; max-width:92vw; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:22px; margin:auto; }
  .modal--wide{ width:660px; }
  .modal__title{ font-family:var(--font-display); font-size:15px; margin:0 0 4px; }
  .modal__subtitle{ font-size:12px; color:var(--text-faint); margin:0 0 16px; }
  .modal__actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:6px; }
  .modal__error{ color:var(--bad); font-size:12.5px; margin:-6px 0 12px; display:none; }

  .empty{ border:1px dashed var(--line-stitch); border-radius:10px; padding:40px 20px; text-align:center; color:var(--text-muted); }
  .empty__stamp{ font-family:var(--font-mono); font-size:11px; letter-spacing:.5px; color:var(--text-faint); text-transform:uppercase; margin-top:6px; display:block; }

  .section-title{ font-family:var(--font-display); font-size:13px; font-weight:600; margin:22px 0 10px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.4px; }
  .section-title:first-child{ margin-top:0; }

  .app--loading .view{ opacity:.4; pointer-events:none; }

  .preview-box{ border:1px dashed var(--line-stitch); border-radius:8px; padding:14px; }
  .preview-box__loading{ color:var(--text-faint); font-size:12.5px; }
  .preview-kpis{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
  .preview-kpi{ background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:8px 12px; }
  .preview-kpi__label{ font-size:10px; text-transform:uppercase; color:var(--text-faint); letter-spacing:.3px; }
  .preview-kpi__value{ font-family:var(--font-mono); font-size:15px; margin-top:2px; }
  .preview-list{ display:flex; flex-direction:column; gap:5px; font-size:12.5px; }
  .preview-list__row{ display:flex; justify-content:space-between; gap:10px; padding:4px 0; border-bottom:1px solid var(--line); }
  .preview-list__row:last-child{ border-bottom:none; }

  .models-rail{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:22px; }
  .model-chip{
    background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:8px 16px;
    cursor:pointer; font-size:13px; color:var(--text-muted); transition:all .12s ease;
  }
  .model-chip:hover{ border-color:var(--text-faint); color:var(--text); }
  .model-chip[data-current="true"]{ background:var(--brass-soft); border-color:var(--brass); color:var(--brass); font-weight:600; }

  @media (max-width: 820px){
    .app{ grid-template-columns:1fr; }
    .sidebar{ display:none; }
    .view{ padding:20px; }
    .form-row, .form-row--3, .form-row--4{ grid-template-columns:1fr; }
  }
</style>

</head>
<body>

  <div id="app" class="app app--loading">

    <aside class="sidebar">
      <div class="brand">
        <span class="brand__mark">◧</span>
        <div class="brand__text">
          <span class="brand__title">Producción</span>
          <span class="brand__subtitle">Ficha técnica &amp; órdenes</span>
        </div>
      </div>

      <nav class="nav" id="nav">
        <button class="nav__item" data-module="ficha"><span class="nav__num">01</span> Ficha técnica</button>
        <button class="nav__item" data-module="produccion"><span class="nav__num">02</span> Producción</button>
      </nav>

      <div class="sidebar__foot">
        <div class="session" id="sessionBox" data-ok="true">
          <span class="session__dot"></span>
          <div class="session__info">
            <span class="session__name" id="sessionName">Conectado</span>
            <span class="session__role" id="sessionRole">Cambiar hoja de cálculo</span>
          </div>
        </div>
      </div>
    </aside>

    <div class="modal-backdrop" id="configScreen" data-open="false">
      <div class="modal">
        <h3 class="modal__title">Conectar con tu Google Sheet</h3>
        <div class="modal__body">
          <p style="color:var(--text-muted); font-size:13px; margin-bottom:14px;">
            Pega aquí la URL de tu Apps Script Web App (la que termina en <code>/exec</code>).
          </p>
          <div class="field">
            <label>URL de la Web App (Apps Script)</label>
            <input type="text" id="configUrlInput" placeholder="https://script.google.com/macros/s/AKfycb.../exec">
          </div>
          <p class="config__error" id="configError" style="color:var(--bad); font-size:13px; display:none;"></p>
        </div>
        <div class="modal__actions">
          <button class="btn btn--ghost" id="configCancel" style="display:none;">Cancelar</button>
          <button class="btn btn--primary" id="configSave">Conectar</button>
        </div>
      </div>
    </div>

    <main class="main">
      <header class="topbar">
        <div>
          <h1 class="topbar__title" id="viewTitle">Ficha técnica</h1>
          <div class="topbar__hint" id="viewHint"></div>
        </div>
        <div class="topbar__actions" id="viewActions"></div>
      </header>

      <div class="toast" id="toast"></div>

      <section class="view" id="view"></section>
    </main>

  </div>

  <datalist id="materialesDatalist"></datalist>

  <script>
(function () {
  'use strict';

  /* ======================= Comunicación con el backend ======================= */

  const DEFAULT_API_URL = ''; // pega aquí tu URL /exec si quieres un valor por defecto
  const API_URL_KEY = 'produccion_api_url';

  function getApiUrl() { return localStorage.getItem(API_URL_KEY) || DEFAULT_API_URL; }
  function setApiUrl(url) { localStorage.setItem(API_URL_KEY, url.trim()); }

  function api(action, payload) {
    const url = getApiUrl();
    if (!url) return Promise.reject(new Error('No hay ninguna hoja de cálculo conectada todavía.'));
    return fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, payload: payload || {} })
    })
      .then(res => {
        if (!res.ok) throw new Error('El servidor respondió con error HTTP ' + res.status);
        return res.json();
      })
      .then(res => res && res.ok ? res.data : Promise.reject(new Error(res ? res.error : 'Sin respuesta del servidor')))
      .catch(err => {
        if (err instanceof TypeError) {
          throw new Error('No se pudo conectar con la Web App. Verifica la URL y que el deployment tenga acceso "Cualquier usuario".');
        }
        throw err;
      });
  }

  /* ============================ Helpers generales ============================ */

  function toast(msg, type) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.setAttribute('data-type', type || 'ok');
    el.setAttribute('data-show', 'true');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => el.setAttribute('data-show', 'false'), 3600);
  }

  function esc(str) {
    return String(str === undefined || str === null ? '' : str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function fmtDate(v) { return v ? new Date(v).toLocaleString() : '—'; }
  function fmtNum(v) { const n = Number(v); return isNaN(n) ? esc(v) : (Math.round(n * 100) / 100).toLocaleString(); }

  function tabla(headers, filas, vacioMsg, ids) {
    if (filas.length === 0) return `<div class="empty">${esc(vacioMsg)}<span class="empty__stamp">Nada por aquí todavía</span></div>`;
    return `<div class="card" style="padding:0; overflow:hidden;"><div class="table-wrap"><table><thead><tr>${headers.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead>
      <tbody>${filas.map((f, i) => `<tr ${ids ? `data-clickable="true" data-row-id="${esc(ids[i])}"` : ''}>${f.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`;
  }

  function debounce(fn, ms) {
    let t;
    return function (...args) { clearTimeout(t); t = setTimeout(() => fn.apply(this, args), ms); };
  }

  function openModal(title, bodyHtml, opts) {
    opts = opts || {};
    const backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    backdrop.setAttribute('data-open', 'true');
    backdrop.innerHTML = `
      <div class="modal ${opts.wide ? 'modal--wide' : ''}">
        <h3 class="modal__title">${esc(title)}</h3>
        ${opts.subtitle ? `<p class="modal__subtitle">${esc(opts.subtitle)}</p>` : ''}
        <div class="modal__body">${bodyHtml}</div>
        <p class="modal__error" data-error></p>
        <div class="modal__actions">
          <button class="btn btn--ghost" data-close>Cerrar</button>
          ${opts.onSave ? `<button class="btn btn--primary" data-save>${esc(opts.saveLabel || 'Guardar')}</button>` : ''}
        </div>
      </div>`;
    document.body.appendChild(backdrop);
    backdrop.addEventListener('mousedown', (e) => { if (e.target === backdrop) backdrop.remove(); });
    backdrop.querySelector('[data-close]').addEventListener('click', () => backdrop.remove());
    if (opts.onMount) opts.onMount(backdrop);
    if (opts.onSave) {
      backdrop.querySelector('[data-save]').addEventListener('click', () => {
        const errEl = backdrop.querySelector('[data-error]');
        errEl.style.display = 'none';
        const result = opts.onSave(backdrop);
        if (result && result.catch) result.catch(e => { errEl.textContent = e.message; errEl.style.display = 'block'; });
      });
    }
    return backdrop;
  }

  function confirmarYEjecutar(mensaje, accion, payload, exito, luego) {
    if (!confirm(mensaje)) return;
    api(accion, payload).then(() => { toast(exito); if (luego) luego(); }).catch(e => toast(e.message, 'error'));
  }

  /* ================================ Estado ================================= */

  const state = { module: 'ficha', modeloSel: null, materialesCache: [] };

  /* ============================ Config de la URL ============================ */

  function showConfigScreen(cancelable) {
    const screen = document.getElementById('configScreen');
    const input = document.getElementById('configUrlInput');
    const errorEl = document.getElementById('configError');
    const cancelBtn = document.getElementById('configCancel');
    input.value = getApiUrl();
    errorEl.style.display = 'none';
    cancelBtn.style.display = cancelable ? 'inline-flex' : 'none';
    screen.setAttribute('data-open', 'true');
    setTimeout(() => input.focus(), 50);
  }
  function hideConfigScreen() { document.getElementById('configScreen').setAttribute('data-open', 'false'); }

  function testAndSaveApiUrl(url) {
    const errorEl = document.getElementById('configError');
    errorEl.style.display = 'none';
    if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(url.trim())) {
      errorEl.textContent = 'Esa URL no parece una Web App de Apps Script válida.';
      errorEl.style.display = 'block';
      return;
    }
    setApiUrl(url);
    document.getElementById('sessionName').textContent = 'Conectando…';
    api('modelos.listar').then(() => {
      hideConfigScreen();
      document.getElementById('sessionBox').setAttribute('data-ok', 'true');
      document.getElementById('sessionName').textContent = 'Conectado';
      goTo('ficha');
    }).catch(err => {
      document.getElementById('sessionBox').setAttribute('data-ok', 'false');
      document.getElementById('sessionName').textContent = 'Sin conexión';
      errorEl.textContent = 'No se pudo conectar: ' + err.message;
      errorEl.style.display = 'block';
    });
  }

  document.getElementById('configSave').addEventListener('click', () => testAndSaveApiUrl(document.getElementById('configUrlInput').value));
  document.getElementById('configCancel').addEventListener('click', hideConfigScreen);
  document.getElementById('sessionRole').addEventListener('click', () => showConfigScreen(!!getApiUrl()));

  /* ================================ Router =================================== */

  const MODULE_TITLES = { ficha: 'Ficha técnica', produccion: 'Producción' };
  const MODULE_HINTS = {
    ficha: 'Crea modelos y define qué materiales consume cada uno',
    produccion: 'Genera órdenes de producción a partir de la ficha técnica'
  };
  const RENDERERS = { ficha: renderFicha, produccion: renderProduccion };

  function goTo(module) {
    state.module = module;
    document.querySelectorAll('.nav__item').forEach(el => el.setAttribute('data-current', el.dataset.module === module ? 'true' : 'false'));
    document.getElementById('viewTitle').textContent = MODULE_TITLES[module] || module;
    document.getElementById('viewHint').textContent = MODULE_HINTS[module] || '';
    document.getElementById('viewActions').innerHTML = '';
    const view = document.getElementById('view');
    view.innerHTML = '<div class="empty">Cargando…</div>';
    Promise.resolve((RENDERERS[module])(view)).catch(err => {
      view.innerHTML = `<div class="empty">${esc(err.message)}</div>`;
      toast(err.message, 'error');
    });
  }

  /* ============================================================
   * Ficha técnica: modelos + BOM en una sola pantalla.
   * ============================================================ */

  function renderFicha(view) {
    document.getElementById('viewActions').innerHTML = `<button class="btn btn--primary" id="btnNuevoModelo">+ Nuevo modelo</button>`;
    return Promise.all([api('modelos.listar'), api('materiales.listar')]).then(([modelos, materiales]) => {
      state.materialesCache = materiales;
      actualizarDatalist(materiales);

      if (modelos.length === 0) {
        view.innerHTML = `<div class="empty">Todavía no hay modelos.<span class="empty__stamp">Crea el primero arriba a la derecha</span></div>`;
        document.getElementById('btnNuevoModelo').addEventListener('click', () => abrirModalModelo());
        return;
      }

      if (!state.modeloSel || !modelos.some(m => m.ID_MODELO === state.modeloSel)) state.modeloSel = modelos[0].ID_MODELO;

      view.innerHTML = `
        <div class="models-rail" id="modelsRail">
          ${modelos.map(m => `<button class="model-chip" data-id="${m.ID_MODELO}" data-current="${m.ID_MODELO === state.modeloSel}">${esc(m.NOMBRE)}</button>`).join('')}
        </div>
        <div id="bomBody"></div>`;

      view.querySelectorAll('.model-chip').forEach(chip => chip.addEventListener('click', () => {
        state.modeloSel = chip.dataset.id;
        view.querySelectorAll('.model-chip').forEach(c => c.setAttribute('data-current', c === chip ? 'true' : 'false'));
        cargarBom(state.modeloSel);
      }));

      document.getElementById('btnNuevoModelo').addEventListener('click', () => abrirModalModelo());
      cargarBom(state.modeloSel);
    });
  }

  function actualizarDatalist(materiales) {
    const dl = document.getElementById('materialesDatalist');
    dl.innerHTML = materiales.map(m => `<option value="${esc(m.NOMBRE)}">`).join('');
  }

  function abrirModalModelo() {
    openModal('Nuevo modelo', `<div class="field"><label>Nombre</label><input id="mNombre" placeholder="Partner, Imperia, Urban…"></div>`, {
      saveLabel: 'Crear modelo',
      onSave: (m) => api('modelos.crear', { NOMBRE: m.querySelector('#mNombre').value.trim() })
        .then(nuevo => { toast('Modelo creado'); m.remove(); state.modeloSel = nuevo.ID_MODELO; goTo('ficha'); })
    });
  }

  function cargarBom(idModelo) {
    const body = document.getElementById('bomBody');
    body.innerHTML = '<div class="empty">Cargando ficha técnica…</div>';
    return api('bom.listarPorModelo', { ID_MODELO: idModelo }).then(rows => {
      const ids = rows.map(r => r.ID_CONSUMO);
      body.innerHTML = `
        ${tabla(['Material', 'Consumo', 'Unidad', 'Depende del color', ''], rows.map(r => [
          esc(r.NOMBRE_MATERIAL), `<span class="mono">${esc(r.CANTIDAD_UNITARIA)}</span>`, esc(r.UNIDAD_MEDIDA),
          r.DEPENDE_COLOR === 'SI' ? `<span class="badge" data-tone="ok">Sí</span>` : `<span class="badge" data-tone="off">No</span>`,
          `<div class="row-actions">
             <button class="btn btn--ghost btn--sm" data-act="edit" data-id="${r.ID_CONSUMO}">Editar</button>
             <button class="btn btn--ghost btn--sm btn--danger" data-act="del" data-id="${r.ID_CONSUMO}">Quitar</button>
           </div>`
        ]), 'Este modelo todavía no tiene materiales. Agrégalos abajo.', ids)}

        <div class="card" style="margin-top:16px;">
          <h3 class="card__title">Agregar material a la ficha</h3>
          <p class="card__hint">Escribe el nombre; si ya existe se reutiliza, si no, se crea automáticamente.</p>
          <div class="form-row--4">
            <div class="field" style="margin-bottom:0;"><label>Material</label><input id="bNombre" list="materialesDatalist" placeholder="Tela, Forro, Logo…"></div>
            <div class="field" style="margin-bottom:0;"><label>Consumo</label><input id="bCantidad" type="number" step="0.0001" placeholder="0.82"></div>
            <div class="field" style="margin-bottom:0;"><label>Unidad</label><input id="bUnidad" placeholder="m, unid."></div>
            <div class="field" style="margin-bottom:0;"><label>¿Depende color?</label><select id="bDependeColor"><option value="SI">Sí</option><option value="NO">No</option></select></div>
          </div>
          <button class="btn btn--primary" id="btnAddBom" style="margin-top:12px;">+ Agregar a la ficha</button>
        </div>`;

      body.querySelectorAll('[data-act="del"]').forEach(b => b.addEventListener('click', (e) => {
        e.stopPropagation();
        confirmarYEjecutar('¿Quitar este material de la ficha técnica?', 'bom.eliminar', { ID_CONSUMO: b.dataset.id }, 'Material quitado', () => cargarBom(idModelo));
      }));
      body.querySelectorAll('[data-act="edit"]').forEach(b => b.addEventListener('click', (e) => {
        e.stopPropagation();
        abrirModalEditarBom(rows.find(r => r.ID_CONSUMO === b.dataset.id), idModelo);
      }));

      document.getElementById('btnAddBom').addEventListener('click', () => {
        const nombre = document.getElementById('bNombre').value.trim();
        const cantidad = document.getElementById('bCantidad').value;
        const unidad = document.getElementById('bUnidad').value.trim();
        const dependeColor = document.getElementById('bDependeColor').value;
        if (!nombre || !cantidad) { toast('Indica el nombre del material y el consumo', 'error'); return; }
        api('bom.agregar', { ID_MODELO: idModelo, NOMBRE_MATERIAL: nombre, CANTIDAD_UNITARIA: cantidad, UNIDAD_MEDIDA: unidad, DEPENDE_COLOR: dependeColor })
          .then(() => { toast('Material agregado a la ficha'); api('materiales.listar').then(actualizarDatalist); cargarBom(idModelo); })
          .catch(e => toast(e.message, 'error'));
      });
    }).catch(err => { body.innerHTML = `<div class="empty">${esc(err.message)}</div>`; });
  }

  function abrirModalEditarBom(fila, idModelo) {
    openModal(`Editar ${fila.NOMBRE_MATERIAL}`, `
      <div class="form-row">
        <div class="field"><label>Consumo</label><input id="eCantidad" type="number" step="0.0001" value="${esc(fila.CANTIDAD_UNITARIA)}"></div>
        <div class="field"><label>¿Depende color?</label><select id="eDependeColor">
          <option value="SI" ${fila.DEPENDE_COLOR === 'SI' ? 'selected' : ''}>Sí</option>
          <option value="NO" ${fila.DEPENDE_COLOR === 'NO' ? 'selected' : ''}>No</option>
        </select></div>
      </div>`, {
      saveLabel: 'Guardar cambios',
      onSave: (m) => api('bom.editar', { ID_CONSUMO: fila.ID_CONSUMO, CANTIDAD_UNITARIA: m.querySelector('#eCantidad').value, DEPENDE_COLOR: m.querySelector('#eDependeColor').value })
        .then(() => { toast('Ficha técnica actualizada'); m.remove(); cargarBom(idModelo); })
    });
  }

  /* ============================================================
   * Producción: seleccionar modelo, colores/cantidades, ver preview,
   * crear orden y generar PDF.
   * ============================================================ */

  function renderProduccion(view) {
    document.getElementById('viewActions').innerHTML = `<button class="btn btn--primary" id="btnNuevaOrden">+ Nueva orden de producción</button>`;
    return Promise.all([api('produccion.listar'), api('modelos.listar')]).then(([ordenes, modelos]) => {
      const ids = ordenes.map(o => o.ID_ORDEN);
      view.innerHTML = tabla(['Código', 'Modelo', 'Cantidad', 'Fecha', ''], ordenes.map(o => [
        `<span class="mono">${esc(o.CODIGO_ORDEN)}</span>`, esc(o.NOMBRE_MODELO), fmtNum(o.CANTIDAD_TOTAL), `<span class="mono">${fmtDate(o.FECHA_CREACION)}</span>`,
        `<div class="row-actions">
           <button class="btn btn--ghost btn--sm" data-act="ver" data-id="${o.ID_ORDEN}">Ver</button>
           <button class="btn btn--ghost btn--sm" data-act="pdf" data-id="${o.ID_ORDEN}">${o.URL_PDF ? 'Abrir PDF' : 'Generar PDF'}</button>
         </div>`
      ]), 'Todavía no hay órdenes de producción.', ids);

      view.querySelectorAll('[data-act="pdf"]').forEach(b => b.addEventListener('click', () => {
        const orden = ordenes.find(o => o.ID_ORDEN === b.dataset.id);
        if (orden && orden.URL_PDF) { window.open(orden.URL_PDF, '_blank'); return; }
        toast('Generando PDF…');
        api('pdf.generarOrdenPdf', { ID_ORDEN: b.dataset.id }).then(r => window.open(r.url, '_blank')).catch(e => toast(e.message, 'error'));
      }));
      view.querySelectorAll('[data-act="ver"]').forEach(b => b.addEventListener('click', () => verOrden(b.dataset.id)));

      document.getElementById('btnNuevaOrden').addEventListener('click', () => {
        if (modelos.length === 0) { toast('Primero crea un modelo con su ficha técnica', 'error'); return; }
        abrirModalNuevaOrden(modelos);
      });
    });
  }

  function verOrden(idOrden) {
    openModal('Detalle de orden', '<div class="empty">Cargando…</div>', { wide: true });
    api('produccion.obtener', { ID_ORDEN: idOrden }).then(orden => {
      const backdrop = document.querySelector('.modal-backdrop[data-open="true"]');
      if (!backdrop) return;
      backdrop.querySelector('.modal__title').textContent = `Orden ${orden.CODIGO_ORDEN}`;
      backdrop.querySelector('.modal__body').innerHTML = `
        <div class="preview-kpis">
          <div class="preview-kpi"><div class="preview-kpi__label">Cantidad total</div><div class="preview-kpi__value">${fmtNum(orden.CANTIDAD_TOTAL)}</div></div>
          <div class="preview-kpi"><div class="preview-kpi__label">Fecha</div><div class="preview-kpi__value">${fmtDate(orden.FECHA_CREACION)}</div></div>
        </div>
        <div class="section-title">Colores</div>
        <div class="preview-list">${orden.detalle.map(d => `<div class="preview-list__row"><span>${esc(d.COLOR)}</span><span class="mono">${fmtNum(d.CANTIDAD)}</span></div>`).join('')}</div>`;
    }).catch(e => toast(e.message, 'error'));
  }

  function abrirModalNuevaOrden(modelos) {
    let filas = [{ COLOR: '', CANTIDAD: '' }];

    function filasHtml() {
      return filas.map((f, i) => `
        <div class="subform" data-fila="${i}">
          ${filas.length > 1 ? `<button type="button" class="btn btn--ghost btn--sm subform__remove" data-remove="${i}">✕</button>` : ''}
          <div class="form-row">
            <div class="field" style="margin-bottom:0;"><label>Color</label><input data-f="color" value="${esc(f.COLOR)}" placeholder="Negro, Azul…"></div>
            <div class="field" style="margin-bottom:0;"><label>Cantidad</label><input data-f="cantidad" type="number" value="${esc(f.CANTIDAD)}"></div>
          </div>
        </div>`).join('');
    }

    function bodyHtml() {
      return `
        <div class="field"><label>Modelo</label><select id="pModelo">${modelos.map(m => `<option value="${m.ID_MODELO}">${esc(m.NOMBRE)}</option>`).join('')}</select></div>
        <div id="filasColor">${filasHtml()}</div>
        <button class="btn btn--ghost" id="btnAddColor" type="button">+ Agregar color</button>
        <div class="section-title">Vista previa</div>
        <div id="previewConsumo" class="preview-box"><div class="preview-box__loading">Elige colores y cantidades para calcular el consumo.</div></div>`;
    }

    const modal = openModal('Nueva orden de producción', bodyHtml(), { wide: true, saveLabel: 'Crear orden' });

    function leerDetalle(m) {
      return Array.from(m.querySelectorAll('[data-fila]')).map(row => ({
        COLOR: row.querySelector('[data-f="color"]').value.trim(),
        CANTIDAD: Number(row.querySelector('[data-f="cantidad"]').value || 0)
      })).filter(d => d.COLOR && d.CANTIDAD > 0);
    }

    function renderPreview(r) {
      return `
        <div class="preview-kpis">
          <div class="preview-kpi"><div class="preview-kpi__label">Unidades totales</div><div class="preview-kpi__value">${fmtNum(r.totalGeneral)}</div></div>
        </div>
        <div class="section-title" style="margin-top:0;">Consumo por material</div>
        <div class="preview-list">${r.materiales.map(mat => `<div class="preview-list__row"><span>${esc(mat.NOMBRE_MATERIAL)}${mat.DEPENDE_COLOR === 'SI' ? ' <span class="badge" data-tone="brass" style="margin-left:6px;">por color</span>' : ''}</span><span class="mono">${fmtNum(mat.CANTIDAD_TOTAL)} ${esc(mat.UNIDAD_MEDIDA)}</span></div>`).join('')}</div>`;
    }

    const actualizarPreview = debounce((m) => {
      const idModelo = m.querySelector('#pModelo').value;
      const detalle = leerDetalle(m);
      const previewEl = m.querySelector('#previewConsumo');
      if (!idModelo || detalle.length === 0) {
        previewEl.innerHTML = '<div class="preview-box__loading">Elige colores y cantidades para calcular el consumo.</div>';
        return;
      }
      previewEl.innerHTML = '<div class="preview-box__loading">Calculando…</div>';
      api('produccion.previsualizar', { ID_MODELO: idModelo, detalleColores: detalle })
        .then(r => { previewEl.innerHTML = renderPreview(r); })
        .catch(e => { previewEl.innerHTML = `<div class="preview-box__loading" style="color:var(--bad)">${esc(e.message)}</div>`; });
    }, 450);

    function wireInputs(m) {
      m.querySelector('#pModelo').addEventListener('change', () => actualizarPreview(m));
      m.querySelectorAll('[data-f="color"], [data-f="cantidad"]').forEach(el => {
        el.addEventListener('change', () => actualizarPreview(m));
        el.addEventListener('input', () => actualizarPreview(m));
      });
      m.querySelectorAll('[data-remove]').forEach(btn => btn.addEventListener('click', () => {
        filas.splice(Number(btn.dataset.remove), 1);
        m.querySelector('#filasColor').innerHTML = filasHtml();
        wireInputs(m);
        actualizarPreview(m);
      }));
    }

    modal.querySelector('#btnAddColor').addEventListener('click', () => {
      filas.push({ COLOR: '', CANTIDAD: '' });
      modal.querySelector('#filasColor').innerHTML = filasHtml();
      wireInputs(modal);
    });
    wireInputs(modal);
    actualizarPreview(modal);

    modal.querySelector('[data-save]').addEventListener('click', () => {
      const idModelo = modal.querySelector('#pModelo').value;
      const detalle = leerDetalle(modal);
      if (detalle.length === 0) { toast('Agrega al menos un color con cantidad', 'error'); return; }
      api('produccion.crearOrden', { ID_MODELO: idModelo, detalleColores: detalle })
        .then(orden => { toast(`Orden ${orden.CODIGO_ORDEN} creada`); modal.remove(); goTo('produccion'); })
        .catch(e => toast(e.message, 'error'));
    });
  }

  /* ================================ Bootstrap ================================ */

  document.querySelectorAll('.nav__item').forEach(item => item.addEventListener('click', () => goTo(item.dataset.module)));

  (function init() {
    const savedUrl = getApiUrl();
    document.getElementById('app').classList.remove('app--loading');
    if (!savedUrl) { showConfigScreen(false); return; }
    document.getElementById('sessionBox').setAttribute('data-ok', 'true');
    document.getElementById('sessionName').textContent = 'Conectado';
    goTo('ficha');
  })();

})();
</script>

</body>
</html>
